name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    name: Python Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          python -m pytest tests/ -x --tb=short -q

      - name: Run integration tests
        run: |
          python -m pytest tests/test_api_integration.py -v --tb=short

  react-build:
    name: React Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Check bundle size
        working-directory: frontend
        run: |
          echo "=== Bundle Size ==="
          ls -lh dist/assets/
          echo ""
          echo "=== Total ==="
          du -sh dist/

  package-validation:
    name: Package Validation
    runs-on: ubuntu-latest
    needs: [python-tests, react-build]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Validate FastAPI serves frontend
        run: |
          python -c "
          from ggufloader.api.app import create_app
          from fastapi.testclient import TestClient
          app = create_app()
          with TestClient(app) as c:
              # Health check
              r = c.get('/api/health')
              assert r.status_code == 200, f'Health check failed: {r.status_code}'
              
              # Frontend served
              r = c.get('/')
              assert r.status_code in (200, 307), f'Frontend not served: {r.status_code}'
              
              # All API endpoints
              for ep in ['/api/model/info', '/api/sessions', '/api/agent/status', '/api/gpu/status', '/api/files/tree']:
                  r = c.get(ep)
                  assert r.status_code == 200, f'{ep} failed: {r.status_code}'
              
              print('All validation checks passed!')
          "

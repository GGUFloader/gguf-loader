[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ggufloader"
version = "2.2.0"
description = "Advanced GGUF Model Loader with Smart Floating Assistant"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Hussain Nazary", email = "hussainnazary475@gmail.com" },
]
keywords = ["gguf", "llm", "llama", "ai", "desktop", "qt", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Pinned to the exact set verified to install cleanly and boot together on
# Windows/macOS/Linux (Python 3.10-3.13). Exact pins mean pip resolves the
# same tested combo for every user - no dependency mismatch, and every name
# here has prebuilt wheels for all three platforms, so pip never needs to
# build anything from source.
dependencies = [
    "PySide6>=6.8,<6.12",
    "llama-cpp-python==0.3.35",
    "langgraph>=0.6.11,<0.7",
    "langgraph-checkpoint-sqlite>=2.0.11,<3",
    "langchain-core>=0.3.86,<0.4",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
ggufloader = "ggufloader.main:main"

[tool.setuptools]
# Everything lives inside the single `ggufloader` package, so a pip install
# claims only ONE top-level name in site-packages. The app's own modules
# (config, utils, ui, core, services, widgets, addons) are imported as
# `ggufloader.xxx` and can never collide with another package's top-level
# modules in a shared/global environment.

[tool.setuptools.packages.find]
include = ["ggufloader*"]

[tool.setuptools.package-data]
ggufloader = ["*.ico", "*.png"]
